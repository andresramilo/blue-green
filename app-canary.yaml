apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: web-color-canary
  namespace: argocd
spec:
  project: default
  source:
    repoURL: https://github.com/andresramilo/blue-green.git
    path: canary
    targetRevision: HEAD
  destination:
    namespace: webcolor
    server: https://kubernetes.default.svc
  syncPolicy:
    syncOptions:
      - CreateNamespace=true
    automated:
      selfHeal: true
      prune: true

apiVersion: v1
kind: Service
metadata:
  name: webcolor-active
spec:
  selector:
    app: webcolor
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: v1
kind: Service
metadata:
  name: webcolor-preview
spec:
  selector:
    app: webcolor
  ports:
    - port: 80
      targetPort: 80
  type: ClusterIP
---
apiVersion: argoproj.io/v1alpha1
kind: Rollout
metadata:
  name: webcolor
spec:
  replicas: 4
  selector:
    matchLabels:
      app: webcolor
  template:
    metadata:
      labels:
        app: webcolor
    spec:
      containers:
        - name: webcolor
          image: fabricioveronez/web-color:green
          ports:
            - containerPort: 80
  minReadySeconds: 30
  strategy:
    blueGreen:
      activeService: webcolor-active
      previewService: webcolor-preview
      autoPromotionEnabled: false
      autoPromotionSeconds: 30
      scaleDownDelaySeconds: 60
---
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: webcolor
spec:
  ingressClassName: traefik
  rules:
    - host: active.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webcolor-active
                port:
                  number: 80
    - host: preview.localhost
      http:
        paths:
          - path: /
            pathType: Prefix
            backend:
              service:
                name: webcolor-preview
                port:
                  number: 80
